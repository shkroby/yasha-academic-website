# ---------------------------------------------------------------------------
# Favorite things, shown on the Shelf page (/shelf/).
#
# Each section becomes a heading on the page, in the order listed here.
# Rename, reorder, or add sections freely (e.g. "Music", "Films"); a section
# with no items is hidden. Every field except `quote` / `title` is optional,
# and Markdown (*italics*, [links](https://...)) works in all of them.
#
# A quote:
#   - quote: "The quotation itself."
#     by: Who said it
#     source: Where it's from        (shown in italics)
#
# Anything else (a book, website, person, ...):
#   - title: The Brothers Karamazov
#     by: Fyodor Dostoevsky         (author, maker, affiliation, ...)
#     url: https://...              (makes the title a link)
#     note: A sentence on why it's here.
# ---------------------------------------------------------------------------

sections:
  - title: Quotes
    items:
      - quote: >-
          I saw my life branching out before me like the green fig tree in the
          story. From the tip of every branch, like a fat purple fig, a
          wonderful future beckoned and winked. One fig was a husband and a
          happy home and children, and another fig was a famous poet and
          another fig was a brilliant professor, and another fig was Ee Gee,
          the amazing editor, and another fig was Europe and Africa and South
          America, and another fig was Constantin and Socrates and Attila and a
          pack of other lovers with queer names and offbeat professions, and
          another fig was an Olympic lady crew champion, and beyond and above
          these figs were many more figs I couldn't quite make out. I saw myself
          sitting in the crotch of this fig tree, starving to death, just
          because I couldn't make up my mind which of the figs I would choose. I
          wanted each and every one of them, but choosing one meant losing all
          the rest, and, as I sat there, unable to decide, the figs began to
          wrinkle and go black, and, one by one, they plopped to the ground at
          my feet.
        by: Sylvia Plath
        source: The Bell Jar

