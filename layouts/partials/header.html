{{- $home := site.Home.RelPermalink }}
{{- $anchor := cond .IsHome "" $home }}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ $home }}">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ $anchor }}#research" data-section="research">Research</a>
      <a href="{{ $anchor }}#writings" data-section="writings">Writings</a>
      <a href="{{ $anchor }}#about" data-section="about">About &amp; Contact</a>
      <a class="nav-blog{{ if eq .Section "blog" }} is-current{{ end }}" href="{{ "blog/" | relURL }}"{{ if eq .Section "blog" }} aria-current="page"{{ end }}><span>Blog</span></a>
      <a href="{{ site.Params.cv | relURL }}">CV<span class="ext" aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
